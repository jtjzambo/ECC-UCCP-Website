<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      // Preserve the path and redirect to the SPA entry point.
      // Example: /blog -> /?__cfspa=/blog
      var path = location.pathname + location.search + location.hash;
      location.replace("/?__cfspa=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
